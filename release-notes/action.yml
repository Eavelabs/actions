# 通用 Release 创建 action
#
# 从调用方仓库的 CHANGELOG.md 提取版本对应内容（多级 fallback），并调用
# softprops/action-gh-release@v2 创建 GitHub Release。
#
# 用法（在调用方 workflow 中）：
#   - name: 🚀 Create Release
#     uses: Eavelabs/actions/release-notes@v1     # 或 ./release-notes 本地路径
#     with:
#       version: "1.0.0"
#       prerelease: "true"
#       release_name_suffix: " (Test)"
#     env:
#       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: 'Create Release from CHANGELOG'
description: 'Extract release notes from CHANGELOG.md and create a GitHub Release'

inputs:
  version:
    description: 'Release version (e.g. 0.0.1b5 or 1.0.0). Optional if derive_version_from_ref=true.'
    required: false
    default: ''
  tag_prefix:
    description: 'Tag prefix'
    required: false
    default: 'v'
  prerelease:
    description: 'Mark as pre-release (true/false)'
    required: false
    default: 'false'
  draft:
    description: 'Create as draft (true/false)'
    required: false
    default: 'false'
  release_name_suffix:
    description: 'Suffix appended to release title (e.g. " (Test)")'
    required: false
    default: ''
  release_name:
    description: 'Project name shown in release title (e.g. "MyApp"). Defaults to version only.'
    required: false
    default: ''
  changelog_path:
    description: 'Path to CHANGELOG.md (relative to caller repo root)'
    required: false
    default: 'CHANGELOG.md'
  changelog_globs:
    description: 'Comma/newline-separated candidate changelog paths. The first one that exists is used (overrides changelog_path). e.g. "docs/CHANGELOG.md,CHANGELOG.md"'
    required: false
    default: ''
  derive_version_from_ref:
    description: 'When true and version is empty, derive version from GITHUB_REF (e.g. refs/tags/v1.2.3 -> 1.2.3)'
    required: false
    default: 'false'
  release_type:
    description: 'Convenience preset: stable | preview | beta | rc | alpha | draft. Maps to prerelease/draft. Explicit prerelease/draft inputs take precedence.'
    required: false
    default: ''
  extra_body:
    description: 'Extra Markdown appended after the changelog section'
    required: false
    default: ''
  fallback_text:
    description: 'Default text used when no changelog content is found'
    required: false
    default: 'Release version'
  files:
    description: 'Files to attach to the release (e.g. dist/*), newline-separated'
    required: false
    default: ''
  generate_release_notes:
    description: 'Append GitHub auto-generated release notes (from commits) to the changelog body'
    required: false
    default: 'false'
  target_commitish:
    description: 'Commitish value that determines where the Git tag is created from'
    required: false
    default: ''
  discussion_category_name:
    description: 'Category name of an existing discussion to create the release in'
    required: false
    default: ''
  fail_on_unmatched_files:
    description: 'Fail if any file in `files` matches no asset'
    required: false
    default: 'false'
  replace_assets:
    description: 'Remove existing assets of the same name before uploading new ones'
    required: false
    default: 'false'

outputs:
  version:
    description: 'Version used (normalized, without tag prefix)'
    value: ${{ steps.meta.outputs.version }}
  tag:
    description: 'Git tag created'
    value: ${{ steps.meta.outputs.tag }}
  title:
    description: 'Release title'
    value: ${{ steps.meta.outputs.title }}
  changes:
    description: 'Extracted changelog content'
    value: ${{ steps.meta.outputs.changes }}

runs:
  using: composite
  steps:
    # 核心逻辑全部收敛在独立脚本 entrypoint.sh，测试直接复用同一份逻辑，
    # 避免 action.yml 与 tests/test.sh 各维护一份导致漂移。
    - name: 📝 Extract changelog & compose meta
      id: meta
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TAG_PREFIX: ${{ inputs.tag_prefix }}
        INPUT_CHANGELOG_PATH: ${{ inputs.changelog_path }}
        INPUT_CHANGELOG_GLOBS: ${{ inputs.changelog_globs }}
        INPUT_DERIVE_VERSION_FROM_REF: ${{ inputs.derive_version_from_ref }}
        INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_FALLBACK_TEXT: ${{ inputs.fallback_text }}
        INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        INPUT_RELEASE_NAME_SUFFIX: ${{ inputs.release_name_suffix }}
        GITHUB_REF: ${{ github.ref }}
      run: bash "${GITHUB_ACTION_PATH}/entrypoint.sh"

    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        name: ${{ steps.meta.outputs.title }}
        body: |
          ${{ steps.meta.outputs.changes }}
          ${{ inputs.extra_body }}
        files: ${{ inputs.files }}
        prerelease: ${{ steps.meta.outputs.prerelease }}
        draft: ${{ steps.meta.outputs.draft }}
        generate_release_notes: ${{ inputs.generate_release_notes }}
        target_commitish: ${{ inputs.target_commitish }}
        discussion_category_name: ${{ inputs.discussion_category_name }}
        fail_on_unmatched_files: ${{ inputs.fail_on_unmatched_files }}
        replace_assets: ${{ inputs.replace_assets }}
